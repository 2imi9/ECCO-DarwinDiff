name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv + Python 3.11
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (CPU torch)
        # UV_TORCH_BACKEND=cpu pulls the CPU torch wheel instead of the multi-GB CUDA
        # build; the suite is CPU-only (the LLC270/data tests self-skip without
        # DARWINDIFF_TEST_LLC270, so no datasets are needed in CI).
        run: uv sync --all-extras
        env:
          UV_TORCH_BACKEND: cpu

      - name: Run tests
        run: uv run pytest tests/ -q

  # Style gate for the package, its tests, and the four infrastructure scripts every session
  # runs (the research-map DB and renderer, the verify_run gate, the mirror check). The rest of
  # scripts/ is deliberately NOT in scope: it carries ~2.5k historical violations across one-off
  # experiment drivers, and gating on those would either fail forever or need a blanket ignore --
  # both inert gates (#247). New scripts are still expected to land ruff-clean (see the
  # "style(analysis)" commits). Pinned to the ruff version in uv.lock so local and CI agree;
  # it does not need torch, so it runs without `uv sync`.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: ruff check (src, tests)
        run: uvx ruff@0.15.12 check src tests mkdocs_hooks.py scripts/research_map_db.py scripts/gen_research_map.py scripts/verify_run.py scripts/check_map_mirror_current.py

  # The e2s adapter falls back to no-op shims when earth2studio is absent, so the main
  # job validates our adapter against OUR shims -- which cannot detect drift in NVIDIA's
  # actual protocol. This job installs the real package and runs the conformance module.
  #
  # It is separate because earth2studio cannot be a declared extra (it needs GRIB C
  # libraries and makes `uv lock` unsatisfiable -- see pyproject.toml). It is
  # non-blocking: an upstream earth2studio break should surface here, not stop a merge.
  e2s-conformance:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv + Python 3.11
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install project (CPU torch)
        run: uv sync --all-extras
        env:
          UV_TORCH_BACKEND: cpu

      - name: Install GRIB libraries + earth2studio
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libeccodes-dev
          uv pip install earth2studio

      - name: Fail if earth2studio did not actually install
        # Without this the conformance module SKIPS and the job passes green while
        # verifying nothing -- the same inert-gate failure mode as piping pytest
        # through `tail`, which silently swallowed a non-zero exit for a whole session.
        run: uv run python -c "import earth2studio.models.px.base as m; print('protocol:', m.PrognosticModel)"

      - name: Run e2s conformance against the real protocol
        run: uv run pytest tests/test_e2s_conformance.py -q -rs
