[project]
name = "darwindiff"
version = "0.0.1"
description = "Differentiable PyTorch reimplementation of ECCO-Darwin ocean biogeochemistry for emulation and parameter learning."
readme = "README.md"
# Upper bound: aiohttp (pulled in via argopy) has no cp314 wheel and its sdist
# build fails on 3.14; a bare ">=3.11" lets a fresh `uv sync` pick 3.14 and break.
# The committed .python-version pins 3.12 (known-good); this cap keeps the
# constraint explicit and tooling-agnostic. See docs/cluster_setup.md.
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Ziming Qi" }]
keywords = [
    "ocean-biogeochemistry",
    "differentiable-physics",
    "ecco-darwin",
    "pytorch",
    "climate-modeling",
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Oceanography",
]

dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "scipy>=1.13",
    "xarray>=2024.9",
    "xgcm>=0.8",
    "xmitgcm>=0.5",
    "dask>=2024.9",
    "netcdf4>=1.7",
    "zarr>=2.18",
    "argopy>=0.1.17",
    "requests>=2.32",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "typer>=0.12",
]

# NOTE: earth2studio is deliberately NOT declared as an optional extra. It requires
# python <3.15 and pulls ~19 packages including pygrib, which needs GRIB C libraries;
# declaring it makes `uv lock` unsatisfiable across this project's target environments.
# Install it separately when you want to run tests/test_e2s_conformance.py:
#     uv pip install earth2studio
# Without it that module skips, and the e2s adapter falls back to no-op shims that
# validate nothing -- see src/darwindiff/e2s/prognostic.py.

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "nbformat>=5.10",
    "nbconvert>=7.16",
    "jupyter>=1.1",
]

[project.urls]
Repository = "https://github.com/2imi9/ECCO-DarwinDiff"
Issues = "https://github.com/2imi9/ECCO-DarwinDiff/issues"

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/darwindiff"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "UP", "SIM", "RUF"]
ignore = [
    # Ambiguous-Unicode rules. Docstrings, comments and messages quote the literature's
    # notation (×, −, µ, σ, ±, →) throughout src/ and tests/; the per-file list below was
    # growing one loader at a time, so the three rules are off globally instead. They only
    # ever fire on strings, docstrings and comments, never on identifiers.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Tests are descriptive; bug-pattern and naming rules are not enforced there.
"tests/**" = ["B", "N"]
# The fixture is a verbatim PANGAEA tab-separated header; wrapping it would change the data.
"tests/test_marsh_loader.py" = ["E501"]
# BGC modules use chemistry-equation naming (K0, K1, K2, DIC, ALK, DFe, P_diatom, K_num,
# etc.) from the published literature (Weiss 1974, Lueker 2000, Dickson 1990, Follows 2006,
# Carroll 2020/2022). Forcing lowercase would obscure the connection to those refs.
"src/darwindiff/carroll6.py" = ["N803", "N806"]
"src/darwindiff/carroll6_5pft.py" = ["N803", "N806"]
"src/darwindiff/carroll6_5pft_2layer.py" = ["N803", "N806"]
"src/darwindiff/carbonate.py" = ["N802", "N803", "N806"]
"src/darwindiff/closures.py" = ["N802", "N803", "N812"]
"src/darwindiff/budget.py" = ["N802", "N806"]
"src/darwindiff/integrators.py" = ["N803", "N806"]
"src/darwindiff/transport.py" = ["N806"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# zarr 3.x ships PEP 695 syntax (`class Array[T]`) that mypy refuses to parse when checking
# as python_version 3.11, and it aborted the whole run inside site-packages before checking
# a single source file ("errors prevented further checking"). zarr is only reached
# transitively through xarray, so skip following its imports. mypy is advisory, not a CI
# gate: ~70 pre-existing complaints remain, mostly `Tensor | float` unions in the box models.
module = ["zarr", "zarr.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
