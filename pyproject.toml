[project]
name = "darwindiff"
version = "0.0.1"
description = "Differentiable PyTorch reimplementation of ECCO-Darwin ocean biogeochemistry for emulation and parameter learning."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ziming Qi" }]
keywords = [
    "ocean-biogeochemistry",
    "differentiable-physics",
    "ecco-darwin",
    "pytorch",
    "climate-modeling",
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Oceanography",
]

dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "scipy>=1.13",
    "xarray>=2024.9",
    "xgcm>=0.8",
    "xmitgcm>=0.5",
    "dask>=2024.9",
    "netcdf4>=1.7",
    "zarr>=2.18",
    "argopy>=0.1.17",
    "requests>=2.32",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "nbformat>=5.10",
    "nbconvert>=7.16",
    "jupyter>=1.1",
]

[project.urls]
Repository = "https://github.com/2imi9/ECCO-DarwinDiff"
Issues = "https://github.com/2imi9/ECCO-DarwinDiff/issues"

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/darwindiff"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "UP", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Tests are descriptive; allow scientific Unicode (μ, ρ, –, ×) in docstrings.
"tests/**" = ["B", "N", "RUF001", "RUF002"]
# BGC modules use chemistry-equation naming (K0, K1, K2, DIC, ALK, DFe, etc.)
# and Greek / Unicode notation in docstrings from the published literature
# (Weiss 1974, Lueker 2000, Dickson 1990, Follows 2006, Carroll 2020/2022).
# Forcing lowercase or ASCII-only would obscure the connection to those refs.
"src/darwindiff/carroll6.py" = ["N806", "RUF002"]
"src/darwindiff/carbonate.py" = ["N802", "N803", "N806", "RUF001", "RUF002"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
