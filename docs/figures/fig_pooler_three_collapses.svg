<text x="590" y="478" font-size="11.5" fill="#52514e">Only the North Atlantic moves. Its per-cell <tspan font-family="ui-monospace, Consolas, monospace">log_sd</tspan> is 0.940</text>
<text x="590" y="495" font-size="11.5" fill="#52514e">(inflation &#215;1.56) against 0.245 at eqpac and 0.379 in the SO.</text>
<line x1="40" y1="518" x2="1000" y2="518" stroke="#e5e4e0" stroke-width="1"/>
<text x="40" y="536" font-size="10.5" fill="#6b6a66">Paired McNemar on <tspan font-family="ui-monospace, Consolas, monospace">scav_rat</tspan>, same seeds and same fits: 13 seeds pass under arithmetic only, 0 under geometric only, P = 2.4e-04. The collapse never flips a seed the other way.</text>
<text x="40" y="553" font-size="10.5" fill="#6b6a66">Source: docs/findings/2026-08-04_pooler_audit_the_flagship_trio_halves.md &#183; graded with scripts/analysis/pooler_audit.py &#183; counts are the per-AOI &#8805;2-of-3 metric, not cell-weighted.</text>
<text x="40" y="570" font-size="10.5" fill="#6b6a66">A separate single-AOI Southern Ocean run (<tspan font-family="ui-monospace, Consolas, monospace">so_only</tspan>) is not shown: there <tspan font-family="ui-monospace, Consolas, monospace">scav_rat</tspan> reads 30/50 arithmetic and 49/50 geometric. Do not conflate it with the SO leg above.</text>
