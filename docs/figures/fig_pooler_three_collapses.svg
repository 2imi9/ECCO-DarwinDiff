<text x="40" y="478" font-size="11.5" fill="#52514e"><tspan font-family="ui-monospace, Consolas, monospace">alpfe</tspan> and <tspan font-family="ui-monospace, Consolas, monospace">R_PICPOC</tspan> are exactly invariant. The trio count equals</text>
