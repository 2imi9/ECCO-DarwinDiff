<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 460" width="1300" height="460" font-family="'EB Garamond', 'Latin Modern Roman', 'Times New Roman', Times, serif" font-size="15">
  <defs>
    <marker id="arrowFwd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111111"/>
    </marker>
    <marker id="arrowBack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/>
    </marker>
  </defs>

  <!-- Backprop arrow: top loop from loss diamond back to DINN box -->
  <path d="M 1190 165 L 1190 50 L 330 50 L 330 175" fill="none" stroke="#D55E00" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#arrowBack)"/>
  <text x="760" y="32" text-anchor="middle" font-size="17" font-style="italic" fill="#D55E00" font-weight="600">backpropagation through SMS via autograd</text>

  <!-- Box 1: covariates -->
  <rect x="20" y="175" width="180" height="170" rx="3" ry="3" fill="#EDEDED" stroke="#333333" stroke-width="1.5"/>
  <text x="110" y="203" text-anchor="middle" font-weight="700" font-size="15">Per-cell environmental</text>
  <text x="110" y="223" text-anchor="middle" font-weight="700" font-size="15">covariates</text>
  <line x1="50" y1="238" x2="170" y2="238" stroke="#555555" stroke-width="0.8"/>
  <text x="110" y="260" text-anchor="middle" font-size="14">SST</text>
  <text x="110" y="280" text-anchor="middle" font-size="14">mixed-layer depth</text>
  <text x="110" y="300" text-anchor="middle" font-size="14">windspeed</text>
  <text x="110" y="320" text-anchor="middle" font-size="14">latitude</text>

  <!-- Arrow 1 → DINN -->
  <line x1="202" y1="260" x2="238" y2="260" stroke="#111111" stroke-width="2" marker-end="url(#arrowFwd)"/>

  <!-- Box 2: DINN -->
  <rect x="240" y="175" width="180" height="170" rx="3" ry="3" fill="#E6F0F7" stroke="#0072B2" stroke-width="2"/>
  <text x="330" y="203" text-anchor="middle" font-weight="700" font-size="17" fill="#0072B2">DINN</text>
  <line x1="270" y1="218" x2="390" y2="218" stroke="#0072B2" stroke-width="0.8"/>
  <text x="330" y="240" text-anchor="middle" font-size="14">per-cell 1×1-conv MLP</text>
  <text x="330" y="262" text-anchor="middle" font-size="14">~454 weights (baseline)</text>
  <text x="330" y="284" text-anchor="middle" font-size="14">~9.4 K (DINNDeep)</text>

  <!-- Arrow 2 → Sigmoid -->
  <line x1="422" y1="260" x2="460" y2="260" stroke="#111111" stroke-width="2" marker-end="url(#arrowFwd)"/>

  <!-- Box 3: Sigmoid -->
  <rect x="462" y="175" width="160" height="170" rx="3" ry="3" fill="#EDEDED" stroke="#333333" stroke-width="1.5"/>
  <text x="542" y="203" text-anchor="middle" font-weight="700" font-size="15">Sigmoid</text>
  <text x="542" y="223" text-anchor="middle" font-weight="700" font-size="15">bounding</text>
  <line x1="492" y1="238" x2="592" y2="238" stroke="#555555" stroke-width="0.8"/>
  <text x="542" y="262" text-anchor="middle" font-size="14">into Carroll</text>
  <text x="542" y="284" text-anchor="middle" font-size="14" font-style="italic">PARAM_BOUNDS</text>

  <!-- Arrow 3 → SMS kernel -->
  <line x1="624" y1="260" x2="658" y2="260" stroke="#111111" stroke-width="2" marker-end="url(#arrowFwd)"/>

  <!-- Box 4: SMS kernel (orange, larger) -->
  <rect x="660" y="140" width="340" height="240" rx="3" ry="3" fill="#FBEFD6" stroke="#E69F00" stroke-width="2"/>
  <text x="830" y="170" text-anchor="middle" font-weight="700" font-size="16" fill="#9A6A00">Differentiable PyTorch</text>
  <text x="830" y="190" text-anchor="middle" font-weight="700" font-size="16" fill="#9A6A00">SMS kernel</text>
  <line x1="690" y1="206" x2="970" y2="206" stroke="#E69F00" stroke-width="0.8"/>
  <text x="830" y="228" text-anchor="middle" font-size="14" font-style="italic">carroll6_step</text>
  <text x="830" y="248" text-anchor="middle" font-size="14" font-style="italic">carroll6_carbonate_step</text>
  <text x="830" y="280" text-anchor="middle" font-size="14">200 forward-Euler steps</text>
  <text x="830" y="310" text-anchor="middle" font-size="14">5–7 prognostic tracers:</text>
  <text x="830" y="330" text-anchor="middle" font-size="14">DFe, P_s, P_l, POC, PIC</text>
  <text x="830" y="358" text-anchor="middle" font-size="13" font-style="italic">(+ DIC, ALK with carbonate)</text>

  <!-- Arrow 4 → Loss diamond -->
  <line x1="1002" y1="260" x2="1056" y2="260" stroke="#111111" stroke-width="2" marker-end="url(#arrowFwd)"/>

  <!-- Loss diamond -->
  <polygon points="1190,165 1280,260 1190,355 1100,260" fill="#FFFFFF" stroke="#333333" stroke-width="1.8"/>
  <text x="1190" y="255" text-anchor="middle" font-weight="700" font-size="15">z-scored</text>
  <text x="1190" y="278" text-anchor="middle" font-weight="700" font-size="15">MSE loss</text>

  <!-- Target box -->
  <rect x="1080" y="395" width="220" height="55" rx="3" ry="3" fill="#EDEDED" stroke="#333333" stroke-width="1.5"/>
  <text x="1190" y="418" text-anchor="middle" font-weight="700" font-size="14">ECCO-Darwin v05</text>
  <text x="1190" y="438" text-anchor="middle" font-size="13">target fields</text>
  <!-- Arrow from target up to diamond -->
  <line x1="1190" y1="393" x2="1190" y2="360" stroke="#111111" stroke-width="2" marker-end="url(#arrowFwd)"/>
</svg>
