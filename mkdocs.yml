site_name: ECCO-DarwinDiff
site_description: >-
  Differentiable ECCO-Darwin for ocean-biogeochemistry parameter recovery
  via gradient descent through the box model.
site_author: ECCO-DarwinDiff contributors

repo_url: https://github.com/2imi9/ECCO-DarwinDiff
repo_name: 2imi9/ECCO-DarwinDiff
edit_uri: edit/main/docs/

# Documentation source lives in docs/. Canonical files that must stay at the
# repo root (STATUS.md, CONTRIBUTING.md, data/README.md) are surfaced via the
# include-markdown plugin from thin stub pages — single source of truth, no copy.
docs_dir: docs

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
    logo: material/waves
  # Use the system font stack (like Furo) instead of loading Google's Roboto.
  font: false
  features:
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.action.edit
    - content.tooltips
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: pink
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: pink
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

# Site-only readability/density polish (no content change). See docs/stylesheets/extra.css.
extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - include-markdown

# Rewrites links that escape docs/ (to source, notebooks, root README/STATUS)
# into GitHub or in-site URLs at build time. See mkdocs_hooks.py.
hooks:
  - mkdocs_hooks.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.magiclink
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Keep internal / in-flight / sensitive material out of the public build.
# These remain in the repo (and on GitHub) — they're just not published to the site.
exclude_docs: |
  briefs/
  talks/
  paper/
  CLAUDE_PROJECT_CONTEXT.md
  pr_v2.2_5pft_box.md
  archive/findings/modis_arc/
  archive/findings/v3.0_arc/
  *.json
  *.csv
  *.tex

# Markdown that lives in docs/ but isn't in the nav (e.g. extra findings) is
# still built and searchable; don't warn about it. Keep link-not-found at warn
# so genuine in-site breakage still surfaces during local builds.
validation:
  nav:
    omitted_files: ignore
  links:
    not_found: warn
    absolute_links: ignore
    unrecognized_links: ignore

# Layered, progressive-disclosure nav: Overview → Status/Matrix → Guides → Reference → Archive.
# The gist is one page (Overview); depth is available but never forced. Per-version research
# writeups are archived (docs/archive/) and out of the nav — reachable from the Archive landing.
nav:
  - Overview: index.md
  - Project Status: status.md
  - Config / Results Matrix: results_matrix.md
  - Guides:
      - DINN design: dinn_design.md
      - ECCO-Darwin relationship: ecco_darwin_relationship.md
      - Parameter inventory: ecco_darwin_parameter_inventory.md
      - Cluster setup: cluster_setup.md
      - Cluster roadmap: cluster_roadmap.md
      - Data sources: data.md
  - Reference:
      - Research log: research_log.md
      - Known issues: issues.md
      - Contributing: contributing.md
  - Archive: archive/index.md
